{% extends "base.html" %}{% block content %}<section class="section admin-layout"><div class="form-card"><h2>Add a product</h2><form method="post" action="/admin/products"><label>Name</label><input name="name" required><label>Description</label><textarea name="description" required></textarea><label>Price</label><input type="number" step="0.01" min="1" name="price" required><label>Stock</label><input type="number" min="0" name="stock" required><label>Category</label><select name="category_id">{% for c in categories %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><label>Emoji</label><input name="emoji" value="🍹"><button class="btn full">Add product</button></form></div><div><h1>Product management</h1>{% for p in products %}<div class="order-card"><div><b>{{p.emoji}} {{p.name}}</b><small>₹{{p.price}} · Stock {{p.stock}} · {% if p.is_active %}Active{% else %}Hidden{% endif %}</small></div>{% if p.is_active %}<form method="post" action="/admin/products/delete/{{p.id}}"><button class="link-button danger">Deactivate</button></form>{% endif %}</div>{% endfor %}</div></section>{% endblock %}
