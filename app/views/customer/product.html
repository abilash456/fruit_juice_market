{% extends "base.html" %}{% block content %}<section class="product-detail"><div class="detail-art">{{product.emoji}}</div><div><span class="eyebrow">FRESH FROM OUR JUICE BAR</span><h1>{{product.name}}</h1><p>{{product.description}}</p><h2>₹{{"%.2f"|format(product.price)}}</h2><p>{{product.stock}} in stock</p><form action="/cart/add/{{product.id}}" method="post" class="inline-form"><input type="number" name="quantity" value="1" min="1" max="{{product.stock}}"><button class="btn">Add to cart</button></form></div></section>{% endblock %}
