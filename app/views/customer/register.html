{% extends "base.html" %}{% block content %}<section class="form-card"><h1>Create your account</h1>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post"><label>Name</label><input name="name" required minlength="2"><label>Email</label><input type="email" name="email" required><label>Password (8+ characters)</label><input type="password" name="password" required minlength="8"><button class="btn full">Register</button></form><p>Already registered? <a href="/login">Login</a></p></section>{% endblock %}
