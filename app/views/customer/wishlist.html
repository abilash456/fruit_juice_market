{% extends "base.html" %}{% block content %}<section class="section"><h1>Your wishlist</h1><div class="product-grid">{% for p in products %}<article class="product-card"><div class="product-art"><span class="big-emoji">{{p.emoji}}</span></div><div class="product-info"><h3>{{p.name}}</h3><b>₹{{p.price}}</b><form method="post" action="/wishlist/remove/{{p.id}}"><button class="link-button danger">Remove</button></form></div></article>{% else %}<p>Your wishlist is empty.</p>{% endfor %}</div></section>{% endblock %}
