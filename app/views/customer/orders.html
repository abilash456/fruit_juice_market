{% extends "base.html" %}{% block content %}<section class="section narrow"><h1>Your orders</h1>{% for o in orders %}<article class="order-card"><div><b>{{o.order_number}}</b><small>{{o.created_at.strftime('%d %b %Y')}}</small></div><strong>₹{{"%.2f"|format(o.total)}}</strong><span class="status">{{o.status}}</span></article>{% else %}<p>You have not placed any orders yet.</p>{% endfor %}</section>{% endblock %}
